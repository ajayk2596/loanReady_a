name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v3

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Update Pods
        run: pod repo update
        working-directory: ios

      - name: 🛠️ Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: 📦 Create IPA Structure
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
        # This creates the standard IPA wrapper around the .app bundle

      - name: 🚀 Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          asset_name: YourAppName.ipa
          tag: v1.0
          overwrite: true
          body: |
            ### ⚠️ Installation Note
            This is an **unsigned** IPA. 
            Because it is missing the `embedded.mobileprovision`, you **cannot** install it via iTunes/Finder directly.
            
            **To install:** 1. Download this `.ipa`.
            2. Use [Sideloadly](https://sideloadly.io/) or [AltStore](https://altstore.io/).
            3. Log in with your free Apple ID when prompted; the tool will fix the "missing provision" error automatically.
